name: s9-ios-tools
# Small iOS userland tools for the Galaxy S9 root image, built with Xcode's iOS SDK.
on:
  push:
    paths:
      - 's9/ios-tools/**'
      - '.github/workflows/s9-ios-tools.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign
        run: |
          cd s9/ios-tools
          mkdir -p out
          # injection probe dylib (loaded into UIKit processes to prove injection)
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -dynamiclib \
            -o out/s9probe.dylib probe.c
          codesign -f -s - out/s9probe.dylib
          # S9Wallpaper tweak (ElleKit, SpringBoard): static lock/home wallpaper
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall -fobjc-arc -dynamiclib \
            -framework Foundation -framework UIKit -o out/S9Wallpaper.dylib S9Wallpaper.m
          codesign -f -s - out/S9Wallpaper.dylib
          cp S9Wallpaper.plist out/
          # S9CAEnv tweak (ElleKit, backboardd): CA_* debug variables from a text file, no hooks
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall -Werror -dynamiclib \
            -o out/S9CAEnv.dylib S9CAEnv.c
          codesign -f -s - out/S9CAEnv.dylib
          cp S9CAEnv.plist out/
          # S9CISoft tweak (ElleKit, UIKit processes): no CoreImage GL contexts when there is no Metal
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall -Werror -fno-objc-arc -dynamiclib \
            -framework Foundation -o out/S9CISoft.dylib S9CISoft.m
          codesign -f -s - out/S9CISoft.dylib
          cp S9CISoft.plist out/
          for t in s9net; do
            xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall \
              -framework CoreFoundation -framework SystemConfiguration "$t.c" -o "out/$t"
            codesign -f -s - --entitlements "$t.entitlements" "out/$t"
            codesign -d --entitlements - "out/$t"
          done
          # measurement tools, read only: CPU per core and thread, memory speed, battery chain
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Werror s9top.c -o out/s9top
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Werror s9membw.c -o out/s9membw
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall -Werror \
            -framework CoreFoundation -framework IOKit s9batt.c -o out/s9batt
          for t in s9top s9membw s9batt; do
            codesign -f -s - "out/$t"
          done
          # S9Audio HAL driver (audio path A: iOS's sound to the PC over the USB network) and s9play
          mkdir -p out/S9Audio.driver
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall -Werror -bundle \
            -framework CoreFoundation -o out/S9Audio.driver/S9Audio S9Audio.c
          cp S9Audio-Info.plist out/S9Audio.driver/Info.plist
          codesign -f -s - out/S9Audio.driver
          codesign -dv out/S9Audio.driver
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -Os -Wall -Werror -fobjc-arc \
            -framework Foundation -framework AVFoundation -framework AudioToolbox s9play.m -o out/s9play
          codesign -f -s - out/s9play
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: s9-ios-tools
          path: s9/ios-tools/out/
